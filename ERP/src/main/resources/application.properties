spring.application.name=student-management-backend
spring.config.import=optional:file:./application-local.properties
server.port=2328

# Default local profile uses H2 so the app can boot without a MySQL installation or password setup.
# To use MySQL instead, create application-local.properties and override these values there.
spring.datasource.url=${DB_URL:jdbc:h2:mem:student_management;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
